<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube 字幕提取器 - 学习版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #ff6b6b 0%, #feca57 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #ff6b6b 0%, #feca57 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .form-content {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
        }

        .form-group label .required {
            color: #e74c3c;
        }

        .form-group input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #ff6b6b;
        }

        .form-group small {
            display: block;
            margin-top: 5px;
            color: #7f8c8d;
            font-size: 12px;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff6b6b 0%, #feca57 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 107, 107, 0.4);
        }

        .btn-primary:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #ecf0f1;
            color: #7f8c8d;
        }

        .btn-secondary:hover {
            background: #d5dbdb;
        }

        .output {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            display: none;
        }

        .output.show {
            display: block;
        }

        .output h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .transcript-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            max-height: 500px;
            overflow-y: auto;
        }

        .transcript-segment {
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }

        .transcript-segment:hover {
            background: #fff3cd;
            border-left-color: #ff6b6b;
        }

        .transcript-segment.selected {
            background: #fff3cd;
            border-left-color: #ff6b6b;
        }

        .segment-timestamp {
            color: #ff6b6b;
            font-weight: 600;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .segment-text {
            color: #333;
            line-height: 1.6;
        }

        .plain-transcript {
            background: white;
            padding: 20px;
            border-radius: 8px;
            line-height: 1.8;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 400px;
            overflow-y: auto;
        }

        .audio-section {
            margin-top: 20px;
            padding: 20px;
            background: #e8f5e9;
            border-radius: 8px;
            display: none;
        }

        .audio-section.show {
            display: block;
        }

        .audio-section h4 {
            color: #2e7d32;
            margin-bottom: 10px;
        }

        .audio-player {
            width: 100%;
            margin-top: 10px;
        }

        .copy-btn {
            margin-top: 10px;
            padding: 10px 20px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .copy-btn:hover {
            background: #229954;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            padding: 10px 20px;
            background: #ecf0f1;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .tab.active {
            background: #ff6b6b;
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #7f8c8d;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #ff6b6b;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .success {
            background: #efe;
            color: #3c3;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .success.show {
            display: block;
        }

        .extracting-audio {
            display: none;
            text-align: center;
            padding: 15px;
            background: #fff3cd;
            border-radius: 6px;
            margin-top: 10px;
        }

        .extracting-audio.show {
            display: block;
        }

        .selected-count {
            background: #ff6b6b;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            display: none;
        }

        .selected-count.show {
            display: inline-block;
        }

        .download-selected-btn {
            background: linear-gradient(135deg, #27ae60 0%, #229954 100%);
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: none;
        }

        .download-selected-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(39, 174, 96, 0.4);
        }

        .download-selected-btn.show {
            display: inline-block;
        }

        .download-section {
            margin-top: 20px;
            padding: 20px;
            background: #e8f5e9;
            border-radius: 8px;
            display: none;
        }

        .download-section.show {
            display: block;
        }

        .selection-toolbar {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 YouTube 字幕提取器 - 学习版</h1>
            <p>提取字幕 + 点击任意片段提取音频进行学习</p>
        </div>

        <div class="form-content">
            <form id="transcriptForm">
                <div class="form-group">
                    <label for="youtubeUrl">YouTube 链接 <span class="required">*</span></label>
                    <input type="text" id="youtubeUrl" required placeholder="https://www.youtube.com/watch?v=...">
                    <small>粘贴任何 YouTube 视频链接</small>
                </div>

                <div class="form-group">
                    <label for="filename">文件名（可选）</label>
                    <input type="text" id="filename" placeholder="例如: Mario-Ho-Interview">
                    <small>留空则自动生成文件名</small>
                </div>

                <div class="buttons">
                    <button type="button" class="btn btn-secondary" onclick="clearForm()">清空</button>
                    <button type="submit" class="btn btn-primary" id="submitBtn">提取字幕</button>
                </div>
            </form>

            <!-- Loading -->
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>正在提取和格式化字幕...</p>
            </div>

            <!-- Error -->
            <div class="error" id="error"></div>

            <!-- Success -->
            <div class="success" id="success"></div>

            <!-- Output -->
            <div class="output" id="output">
                <h3>✅ 字幕已提取</h3>

                <div class="tabs">
                    <button class="tab active" onclick="switchTab('timestamps')">带时间戳（学习模式）</button>
                    <button class="tab" onclick="switchTab('plain')">纯文本</button>
                </div>

                <!-- Timestamp View -->
                <div id="timestampsTab" class="tab-content active">
                    <div class="selection-toolbar">
                        <span style="flex: 1; color: #666; font-size: 14px;">
                            💡 点击片段进行选择，再次点击取消选择
                        </span>
                        <span class="selected-count" id="selectedCount">已选 0 个片段</span>
                        <button class="download-selected-btn" id="downloadAudioBtn" onclick="downloadSelectedMedia('audio')">
                            🎵 下载音频
                        </button>
                        <button class="download-selected-btn" id="downloadVideoBtn" onclick="downloadSelectedMedia('video')" style="background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);">
                            🎥 下载视频
                        </button>
                    </div>
                    <div class="transcript-container" id="transcriptContainer">
                        <!-- Segments will be inserted here -->
                    </div>
                </div>

                <!-- Plain Text View -->
                <div id="plainTab" class="tab-content">
                    <pre class="plain-transcript" id="plainTranscript"></pre>
                </div>

                <button class="copy-btn" onclick="copyTranscript()">📋 复制纯文本到剪贴板</button>
            </div>
        </div>
    </div>

    <script>
        let currentData = null;
        let selectedSegments = new Set(); // Store indices of selected segments

        document.getElementById('transcriptForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const youtubeUrl = document.getElementById('youtubeUrl').value.trim();
            const filename = document.getElementById('filename').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            const output = document.getElementById('output');
            const error = document.getElementById('error');
            const success = document.getElementById('success');

            // Hide previous results
            output.classList.remove('show');
            error.classList.remove('show');
            success.classList.remove('show');

            // Show loading
            submitBtn.disabled = true;
            loading.classList.add('show');

            try {
                const response = await fetch('http://localhost:8002/extract', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        url: youtubeUrl,
                        filename: filename || null
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    currentData = data;

                    // Display transcript with timestamps
                    displayTimestampedTranscript(data.timestamped_transcript);

                    // Display plain text
                    document.getElementById('plainTranscript').textContent = data.transcript;

                    // Show success
                    output.classList.add('show');
                    success.innerHTML = `✅ 字幕已保存到: <strong>${data.file_path}</strong>`;
                    success.classList.add('show');
                    output.scrollIntoView({ behavior: 'smooth' });
                } else {
                    error.innerHTML = `❌ ${data.error || '提取失败'}`;
                    error.classList.add('show');
                }
            } catch (err) {
                error.innerHTML = `❌ 连接服务器失败: ${err.message}<br>请确保服务器正在运行`;
                error.classList.add('show');
            } finally {
                submitBtn.disabled = false;
                loading.classList.remove('show');
            }
        });

        function displayTimestampedTranscript(segments) {
            const container = document.getElementById('transcriptContainer');
            container.innerHTML = '';
            selectedSegments.clear(); // Clear previous selections
            updateSelectionUI();

            segments.forEach((segment, index) => {
                const div = document.createElement('div');
                div.className = 'transcript-segment';
                div.dataset.index = index;
                div.innerHTML = `
                    <div class="segment-timestamp">⏱ ${segment.timestamp}</div>
                    <div class="segment-text">${segment.text}</div>
                `;

                div.addEventListener('click', () => toggleSegmentSelection(segment, index, div));
                container.appendChild(div);
            });
        }

        function toggleSegmentSelection(segment, index, element) {
            if (selectedSegments.has(index)) {
                // Deselect
                selectedSegments.delete(index);
                element.classList.remove('selected');
            } else {
                // Select
                selectedSegments.add(index);
                element.classList.add('selected');
            }

            updateSelectionUI();
        }

        function updateSelectionUI() {
            const count = selectedSegments.size;
            const selectedCountEl = document.getElementById('selectedCount');
            const downloadAudioBtn = document.getElementById('downloadAudioBtn');
            const downloadVideoBtn = document.getElementById('downloadVideoBtn');

            if (!selectedCountEl || !downloadAudioBtn || !downloadVideoBtn) return;

            if (count > 0) {
                selectedCountEl.textContent = `已选 ${count} 个片段`;
                selectedCountEl.classList.add('show');
                downloadAudioBtn.classList.add('show');
                downloadVideoBtn.classList.add('show');
            } else {
                selectedCountEl.classList.remove('show');
                downloadAudioBtn.classList.remove('show');
                downloadVideoBtn.classList.remove('show');
            }
        }

        async function downloadSelectedMedia(type) {
            if (selectedSegments.size === 0 || !currentData) return;

            const segments = currentData.timestamped_transcript;
            const selectedIndices = Array.from(selectedSegments).sort((a, b) => a - b);
            const selectedSegmentsData = selectedIndices.map(i => segments[i]);

            const endpoint = type === 'audio' ? 'extract-batch-audio' : 'extract-batch-video';
            const mediaType = type === 'audio' ? '音频' : '视频';

            try {
                const response = await fetch(`http://localhost:8002/${endpoint}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        video_url: currentData.video_url,
                        segments: selectedSegmentsData,
                        output_name: `selected_segments_${type}`
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    const message = `✅ 成功提取 ${selectedIndices.length} 个片段的${mediaType}！\n\n`;
                    if (data.combined_file) {
                        message += `保存位置: ${data.combined_file}\n\n`;
                    } else {
                        message += `保存位置: ${data.audio_files.join('\n')}\n\n`;
                    }
                    message += `总计时长: ${data.total_duration.toFixed(1)} 秒`;
                    alert(message);
                } else {
                    alert(`❌ ${mediaType}提取失败: ${data.error}`);
                }
            } catch (err) {
                alert(`❌ ${mediaType}提取失败: ${err.message}`);
            }
        }

        function switchTab(tab) {
            // Update tab buttons
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');

            // Update tab content
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById(tab + 'Tab').classList.add('active');
        }

        function clearForm() {
            document.getElementById('transcriptForm').reset();
            document.getElementById('output').classList.remove('show');
            document.getElementById('error').classList.remove('show');
            document.getElementById('success').classList.remove('show');
            currentData = null;
            selectedSegments.clear();
        }

        function copyTranscript() {
            if (!currentData) return;

            const transcript = currentData.transcript;
            navigator.clipboard.writeText(transcript).then(() => {
                const btn = document.querySelector('.copy-btn');
                btn.textContent = '✅ 已复制!';
                setTimeout(() => {
                    btn.textContent = '📋 复制纯文本到剪贴板';
                }, 2000);
            }).catch(err => {
                alert('复制失败，请手动复制');
            });
        }
    </script>
</body>
</html>
